name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: SEO contract tests
        run: npm run test:seo

      - name: Build prelaunch
        env:
          SEO_INDEXING_ENABLED: "false"
          VERCEL_ENV: preview
        run: npm run build

      - name: Validate prelaunch HTTP
        env:
          SEO_INDEXING_ENABLED: "false"
          VERCEL_ENV: preview
          SEO_TEST_ORIGIN: http://127.0.0.1:3101
          SEO_TEST_HOST: localhost:3101
          SEO_EXPECT_BUILD_INDEXING: "false"
        run: |
          set -euo pipefail

          log_file="${RUNNER_TEMP}/magenta-next-prelaunch.log"
          server_pid=""

          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          ./node_modules/.bin/next start -H 127.0.0.1 -p 3101 >"$log_file" 2>&1 &
          server_pid=$!

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 \
              -H "Host: ${SEO_TEST_HOST}" \
              "${SEO_TEST_ORIGIN}/" >/dev/null 2>&1; then
              ready=true
              break
            fi

            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            sed -n '1,240p' "$log_file"
            exit 1
          fi

          npm run validate:seo-http

      - name: Build future cutover simulation
        env:
          SEO_INDEXING_ENABLED: "true"
          VERCEL_ENV: production
        run: npm run build

      - name: Validate future canonical and noncanonical HTTP
        env:
          SEO_INDEXING_ENABLED: "true"
          VERCEL_ENV: production
          SEO_TEST_ORIGIN: http://127.0.0.1:3102
          SEO_TEST_HOST: www.magentauruguay.com
          SEO_EXPECT_BUILD_INDEXING: "true"
        run: |
          set -euo pipefail

          log_file="${RUNNER_TEMP}/magenta-next-future.log"
          server_pid=""

          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          ./node_modules/.bin/next start -H 127.0.0.1 -p 3102 >"$log_file" 2>&1 &
          server_pid=$!

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 \
              -H "Host: ${SEO_TEST_HOST}" \
              "${SEO_TEST_ORIGIN}/" >/dev/null 2>&1; then
              ready=true
              break
            fi

            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            sed -n '1,240p' "$log_file"
            exit 1
          fi

          npm run validate:seo-http
          SEO_TEST_HOST=magenta-paysandu.vercel.app npm run validate:seo-http
